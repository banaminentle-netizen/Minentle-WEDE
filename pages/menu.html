<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuicyBites | Our Delicious Menu & Search</title>
    <meta name="description" content="Explore the JuicyBites menu featuring delicious burgers, kotas, and crispy chicken items. Search and filter your favorite meals easily.">
    <meta name="keywords" content="JuicyBites menu, burgers, kotas, fast food Gqeberha, order food">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">HOME</a>
            <a href="about.html">ABOUT US</a>
            <a href="menu.html">MENU</a>
            <a href="enquiry.html">ENQUIRY</a>
            <a href="contact.html">CONTACT US</a>
        </nav>
    </header>

    <main>
        <section class="menu-section">
            <h1>Our Menu & Search</h1>
            <p>Find your favorite meal quickly using our live search feature below.</p>
            
            <!-- Dynamic Content & Search Feature -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for burgers, kotas..." onkeyup="searchMenu()">
            </div>

            <!-- Gallery with Lightbox Feature -->
            <div class="gallery-grid" id="menuGrid">
                <div class="gallery-item" onclick="openLightbox('../assets/images/Chipkota.jpg', 'Chip Kota')">
                    <img src="../assets/images/Chipkota.jpg" alt="Delicious Chip Kota fast food meal" width="300" height="200">
                    <h3>Chip Kota</h3>
                </div>
                <div class="gallery-item" onclick="openLightbox('../assets/images/Crumbedchickenkota.jpg', 'Crumbed Chicken Kota')">
                    <img src="../assets/images/Crumbedchickenkota.jpg" alt="Crispy Crumbed Chicken Kota specialty" width="300" height="200">
                    <h3>Crumbed Chicken Kota</h3>
                </div>
                <div class="gallery-item" onclick="openLightbox('../assets/images/Fullyloadedkota.jpg', 'Fully Loaded Kota')">
                    <img src="../assets/images/Fullyloadedkota.jpg" alt="Fully Loaded Kota with extra cheese and meat" width="300" height="200">
                    <h3>Fully Loaded Kota</h3>
                </div>
                <div class="gallery-item" onclick="openLightbox('../assets/images/Signaturejuicyburger.jpg', 'Signature Juicy Burger')">
                    <img src="../assets/images/Signaturejuicyburger.jpg" alt="JuicyBites Signature Juicy Burger with fries" width="300" height="200">
                    <h3>Signature Juicy Burger</h3>
                </div>
            </div>
        </section>

        <!-- Lightbox Modal -->
        <div id="lightboxModal" class="lightbox" onclick="closeLightbox()">
            <span class="close-btn">&times;</span>
            <img id="lightboxImg" src="" alt="Enlarged menu preview">
            <p id="lightboxCaption"></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 JuicyBites. All rights reserved.</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
