<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee's Coffee Shop | ENQUIRY</title>
</head>

<body>

    <!-- Header -->
    <header>

        <!-- Logo goes here -->

        <!-- Navigation links -->
        <nav>
            <a href="../index.html">HOME</a>
            <a href="./about.html">ABOUT US</a>
            <a href="./contact.html">CONTACT US</a>
            <a href="./enquiry.html">ENQUIRY</a>
            <a href="./services.html">SERVICES</a>
        </nav>

    </header>

    <!-- Main section -->
    <main>

        <section>

            <h1 style="text-align: center;">Make an Enquiry</h1>

            <p style="text-align: center;">
                Have a question about our menu, products or services?
                Complete the form below and our friendly team will assist you.
            </p>

        </section>

        <!-- Enquiry Form -->
        <section>

            <form>

                <label for="name">Full Name:</label>
                <br>
                <input type="text" id="name" name="name" required>
                <br><br>

                <label for="email">Email Address:</label>
                <br>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="phone">Phone Number:</label>
                <br>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <label for="enquiry">Type of Enquiry:</label>
                <br>

                <select id="enquiry" name="enquiry">

                    <option value="menu">Menu Information</option>
                    <option value="order">Order Enquiry</option>
                    <option value="booking">Booking Enquiry</option>
                    <option value="general">General Enquiry</option>

                </select>

                <br><br>

                <label for="message">Your Message:</label>
                <br>

                <textarea id="message" name="message" rows="6" cols="40"
                    placeholder="Enter your enquiry here..." required></textarea>

                <br><br>

                <input type="submit" value="Submit Enquiry">
                <input type="reset" value="Clear">

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>

    </footer>

</body>

</html>
