<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuicyBites | Customer Enquiry</title>
    <meta name="description" content="Submit your food inquiries, catering requests, or feedback to JuicyBites.">
    <meta name="keywords" content="JuicyBites enquiry, catering, fast food support">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">HOME</a>
            <a href="about.html">ABOUT US</a>
            <a href="menu.html">MENU</a>
            <a href="enquiry.html">ENQUIRY</a>
            <a href="contact.html">CONTACT US</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h1>Make an Enquiry</h1>
            <p>Fill out the form below and we will respond to your query shortly.</p>

            <form id="enquiryForm" onsubmit="return validateEnquiryForm(event)">
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName">
                    <small id="nameError" class="error-text"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                    <small id="emailError" class="error-text"></small>
                </div>

                <div class="form-group">
                    <label for="enquiryType">Enquiry Type:</label>
                    <select id="enquiryType" name="enquiryType">
                        <option value="">Select option...</option>
                        <option value="catering">Catering Services</option>
                        <option value="feedback">Food Feedback</option>
                        <option value="general">General Question</option>
                    </select>
                    <small id="typeError" class="error-text"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                    <small id="msgError" class="error-text"></small>
                </div>

                <button type="submit" class="submit-btn">Submit Enquiry</button>
            </form>

            <!-- Feedback Response Area -->
            <div id="formFeedback" class="feedback-message"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 JuicyBites. All rights reserved.</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
