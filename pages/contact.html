<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuicyBites | Contact Us & Location</title>
    <meta name="description" content="Get in touch with JuicyBites in Gqeberha. View our location map, opening hours, and contact details.">
    <meta name="keywords" content="JuicyBites contact, location, Gqeberha restaurant, address">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">HOME</a>
            <a href="about.html">ABOUT US</a>
            <a href="menu.html">MENU</a>
            <a href="enquiry.html">ENQUIRY</a>
            <a href="contact.html">CONTACT US</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p>We would love to hear from you. Visit our store or send us a message below.</p>

            <div class="contact-grid">
                <!-- Contact Form with Validation & Feedback -->
                <div class="contact-form-container">
                    <h3>Send Us a Message</h3>
                    <form id="contactForm" onsubmit="return validateContactForm(event)">
                        <div class="form-group">
                            <label for="cName">Your Name:</label>
                            <input type="text" id="cName">
                            <small id="cNameError" class="error-text"></small>
                        </div>
                        <div class="form-group">
                            <label for="cEmail">Your Email:</label>
                            <input type="email" id="cEmail">
                            <small id="cEmailError" class="error-text"></small>
                        </div>
                        <div class="form-group">
                            <label for="cMessage">Your Message:</label>
                            <textarea id="cMessage" rows="3"></textarea>
                            <small id="cMsgError" class="error-text"></small>
                        </div>
                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                    <div id="contactFeedback" class="feedback-message"></div>
                </div>

                <!-- Interactive Map Feature -->
                <div class="map-container">
                    <h3>Our Location (Gqeberha)</h3>
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3312.8!2d25.6013!3d-33.9608!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzPCsDU3JzM4LjkiUyAyNSUzMzYnMDQuNyJF!5e0!3m2!1sen!2sza!4v1650000000000!5m2!1sen!2sza" 
                        width="100%" 
                        height="300" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy"
                        title="JuicyBites Location Map in Gqeberha">
                    </iframe>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 JuicyBites. All rights reserved.</p>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
